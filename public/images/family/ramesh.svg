  <line x1="56" y1="56" x2="64" y2="56" stroke="#334155" stroke-width="1.6"/>

  <!-- Eyes -->
  <circle cx="50" cy="56" r="1.5" fill="#0f172a"/>
  <circle cx="70" cy="56" r="1.5" fill="#0f172a"/>

