  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-meera)" stroke="#a855f7" stroke-width="2"/>

  <!-- Long Hair back -->
  <path d="M34 50 C32 80, 40 98, 48 104 L72 104 C80 98, 88 80, 86 50 Z" fill="#1e1b4b"/>

  <!-- Neck & Shoulders -->
